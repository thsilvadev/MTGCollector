services:

  # ── MySQL database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-mtgchest}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  12
    networks:
      - app_network

  # ── Node.js backend ──────────────────────────────────────────────────────────
  backend:
    build: ./Backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      HOST:           db
      PORT:           3000
      IP:             0.0.0.0
      DB_USER:        root
      PASSWORD:       ${MYSQL_ROOT_PASSWORD}
      DATABASE:       ${MYSQL_DATABASE:-mtgchest}
      AUTH_TOKEN_TAG:   ${JWT_SECRET}
      NOREPLY_PASSWORD: ${NOREPLY_PASSWORD:-}
      PYTHON_OCR_URL:   http://python-ocr:8001
    volumes:
      - backend_data:/app/data   # persists set icons index across deploys
    depends_on:
      db:
        condition: service_healthy
      python-ocr:
        condition: service_started
    networks:
      - app_network

  # ── React frontend served by nginx ───────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

  # ── Python OCR microservice ─────────────────────────────────────────────────
  python-ocr:
    build: ./python-ocr
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "4"
    mem_limit: 3g
    networks:
      - app_network

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  backend_data:   # persists set icon index + debug images across container rebuilds

networks:
  app_network:
    driver: bridge